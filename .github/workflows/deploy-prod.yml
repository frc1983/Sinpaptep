name: Deploy via FTP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy para Locaweb
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configura o PHP na mesma versão do servidor
      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, pdo, pdo_mysql, gd, zip, curl
          coverage: none

      # 3. Cache do Composer para acelerar deploys futuros
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # 4. Instala dependências de produção (sem pacotes de dev/teste)
      - name: Instalar dependências (Composer)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # 5. Roda o init do Yii2 no ambiente de produção
      #    Isso copia os arquivos de environments/prod para os lugares certos
      - name: Inicializar ambiente de produção (Yii2 init)
        run: php init --env=Production --overwrite=All

      # 6. Envia tudo para a Locaweb via FTP
      - name: Deploy FTP para Locaweb
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /public_html/
          # Exclui arquivos que não devem ir para produção
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/_test*
            **/Sinpaptep_old/**
            **/Instagram_Noticias/**
            **/vagrant/**
            **/*.bat
            **/Vagrantfile
            **/docker-compose.yml
            **/Dockerfile
            **/codeception.yml
            **/phpunit.xml
            **/check-*.php
            **/test-*.php
            **/phpinfo.php
