name: Deploy via FTP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy para Locaweb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy FTP para Locaweb
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/tests/**
            **/_test*
            **/Sinpaptep_old/**
            **/Instagram_Noticias/**
            **/vagrant/**
            **/*.bat
            **/Vagrantfile
            **/docker-compose.yml
            **/Dockerfile
            **/codeception.yml
            **/phpunit.xml
            **/check-*.php
            **/test-*.php
            **/phpinfo.php
